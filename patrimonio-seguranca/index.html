<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrimônio de Segurança</title>
<meta name="theme-color" content="#070b16">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="../seguranca-cftv/estilo.css?v=20261113-2">
<style>
.lojas td.n b{color:var(--azul)}
.barra{display:inline-block;height:8px;background:var(--azul2);border-radius:4px;vertical-align:middle;margin-right:6px}
.sel{background:var(--azul3)!important}
@media print{.filtros,.acoes{display:none!important}}
</style>
</head>
<body>

<div id="vLogin" class="hidden login">
  <div class="marca">🛡️ Patrimônio de Segurança</div>
  <div class="sub">Entre com o seu usuário do Portal Esposende</div>
  <div class="card">
    <label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" inputmode="email">
    <label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <div id="lErr" class="err"></div>
    <button class="btn pri largo" onclick="entrar()">Entrar</button>
  </div>
</div>
<div id="vSem" class="hidden card vazio" style="max-width:560px;margin:40px auto">Módulo restrito a Presidência, Diretoria, Segurança e usuários autorizados.
  <div style="margin-top:12px"><button class="btn" onclick="sair()">Sair</button></div></div>

<div id="vApp" class="hidden">
  <header class="topo">
    <div><h1>🛡️ Patrimônio de Segurança</h1><div class="sub" id="quem"></div></div>
    <div class="acoes"><button class="btn" onclick="carregar()">Atualizar</button><button class="btn" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="excel()">Excel</button><button class="btn" onclick="sair()">Sair</button></div>
  </header>

  <div class="info" id="regra" style="margin-top:14px"></div>
  <div class="grid" id="kpis"></div>

  <section class="filtros card" style="margin-top:14px">
    <div><label for="fLoja">Loja</label><select id="fLoja" onchange="render()"><option value="">Todas</option></select></div>
    <div><label for="fCat">Equipamento</label><select id="fCat" onchange="render()"><option value="">Todos</option></select></div>
    <div><label for="fBase">Origem</label><select id="fBase" onchange="render()"><option value="">Todas</option><option value="anterior_2026">Anterior a 2026</option>
      <option value="compras_2026">Compras de 2026</option><option value="estimativa">Estimativa</option></select></div>
    <div><label for="fBusca">Buscar item</label><input id="fBusca" oninput="render()" placeholder="ex.: gravador, sensor"></div>
    <div class="fbtn"><button class="btn" onclick="limpar()">Limpar</button></div>
  </section>

  <div class="g2" style="margin-top:6px">
    <div><h2>Por loja</h2><div id="tLojas"></div></div>
    <div><h2>Por equipamento</h2><div id="tCats"></div><h2>Preços usados</h2><div id="tPrecos"></div></div>
  </div>
  <h2>Itens</h2><div id="tItens"></div>
  <div class="sub" id="rodape" style="margin-top:10px"></div>
</div>
<div id="toast" class="toast"></div>

<script>
'use strict';
const SB_URL = 'https://rdztzurfesnobfkazgpm.supabase.co', SB_KEY = 'sb_publishable_4LHSO4TrP7F4m4tpJyH44g_BGmfC92h';
const NO_PORTAL = /github\.io$/.test(location.hostname);
const sb = supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, ...(NO_PORTAL ? {} : {storageKey: 'cftv-auth'})}});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const brl = v => v === null || v === undefined ? '—' : Number(v).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
const nf = (v, d = 0) => Number(v || 0).toLocaleString('pt-BR', {maximumFractionDigits: d});
const soma = (a, f) => a.reduce((s, x) => s + Number(f(x) || 0), 0);
const CAT = {camera: 'Câmeras', dvr_nvr: 'Gravadores (DVR/NVR)', hd: 'HDs de gravação', alarme_sensor: 'Alarmes e sensores', conector_acessorio: 'Power balun',
  rede_rack: 'Switch e rack', incendio: 'Incêndio', fonte_energia: 'Fontes e energia', perimetro: 'Cerca e concertina'};
const BASE = {anterior_2026: 'Anterior a 2026', compras_2026: 'Compra 2026', estimativa: 'Estimativa'};
let P = null, LOJAS = new Map(), ATIVAS = new Map();
const nLoja = c => c === null || c === undefined ? 'Sem loja definida' : c === 0 ? 'CD / Matriz' : `${String(c - 900).padStart(2, '0')} · ${(LOJAS.get(c) || ATIVAS.get(c) || {}).nome || 'Loja ' + c}`;
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 5000); }
function mostrar(v) { ['vLogin', 'vSem', 'vApp'].forEach(x => $(x).classList.toggle('hidden', x !== v)); }

async function iniciar() {
  const u = (await sb.auth.getUser()).data.user;
  if (!u) return mostrar('vLogin');
  const {data: papel} = await sb.rpc('cftv_papel');
  if (!papel) return mostrar('vSem');
  $('quem').textContent = u.email + ' · equipamentos de segurança a preço de reposição de hoje';
  mostrar('vApp'); sb.rpc('cftv_registrar', {p_acao: 'acesso', p_tabela: 'tela', p_registro: 'patrimonio-seguranca'}).then(() => {});
  carregar();
}
async function entrar() {
  $('lErr').textContent = '';
  const {error} = await sb.auth.signInWithPassword({email: $('lEmail').value.trim(), password: $('lSenha').value});
  if (error) { $('lErr').textContent = 'Email ou senha incorretos.'; return; }
  iniciar();
}
// Dentro do Portal (mesma sessão): "Sair" não pode deslogar o Portal inteiro — esconde o botão.
const EMBUTIDO = (() => { try { return window.top !== window; } catch (e) { return true; } })();
if (EMBUTIDO && NO_PORTAL) document.addEventListener('DOMContentLoaded', () => document.querySelectorAll('[onclick="sair()"]').forEach(b => b.style.display = 'none'));
async function sair() { if (EMBUTIDO && NO_PORTAL) return; await sb.auth.signOut(); location.reload(); }

async function carregar() {
  $('kpis').innerHTML = '<div class="card vazio">Carregando…</div>';
  const [pt, lj, at] = await Promise.all([sb.rpc('cftv_patrimonio', {p_loja: null}), sb.from('cftv_lojas').select('codigo,nome'), sb.rpc('cftv_lojas_ativas')]);
  if (pt.error) { if (/42501|permiss/i.test(pt.error.message + pt.error.code)) return mostrar('vSem'); $('kpis').innerHTML = `<div class="card vazio">${esc(pt.error.message)}</div>`; return; }
  P = pt.data; LOJAS = new Map((lj.data || []).map(l => [l.codigo, l])); ATIVAS = new Map((at.data || []).filter(a => a.ativo).map(a => [a.codigo, a]));
  const lojas = [...new Set([...ATIVAS.keys(), ...P.linhas.map(x => x.loja)])].sort((a, b) => (a ?? 9999) - (b ?? 9999));
  $('fLoja').innerHTML = '<option value="">Todas</option>' + lojas.map(c => `<option value="${c === null ? 'null' : c}">${esc(nLoja(c))}</option>`).join('');
  $('fCat').innerHTML = '<option value="">Todos</option>' + Object.entries(CAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  render();
}
function filtradas() {
  const fl = $('fLoja').value, fc = $('fCat').value, fb = $('fBase').value, q = $('fBusca').value.trim().toLowerCase();
  return P.linhas.filter(x => (fl === '' || String(x.loja) === fl) && (!fc || x.categoria === fc) && (!fb || x.base === fb) && (!q || (x.item || '').toLowerCase().includes(q)));
}
function tabela(cols, linhas, clic, total) {
  if (!linhas.length) return '<div class="card vazio">Nada neste filtro.</div>';
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.t}</th>`).join('')}</tr></thead><tbody>${linhas.map(r =>
    `<tr class="${clic ? 'clic' : ''}" ${clic ? `onclick="${clic(r)}"` : ''}>${cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody>
    ${total ? `<tfoot><tr>${total.map((t, i) => `<th class="${cols[i].n ? 'n' : ''}">${t}</th>`).join('')}</tr></tfoot>` : ''}</table></div>`;
}
function render() {
  const l = filtradas(), tot = soma(l, x => x.valor), est = soma(l.filter(x => x.estimado), x => x.valor);
  const porBase = k => soma(l.filter(x => x.base === k), x => x.valor);
  const cam = soma(l.filter(x => x.categoria === 'camera'), x => x.qtd), grav = soma(l.filter(x => x.categoria === 'dvr_nvr'), x => x.qtd);
  $('regra').innerHTML = `<b>Como é calculado:</b> ${esc(P.regra)} Câmeras, gravadores (equivalentes de 16 canais) e HDs pelo preço de reposição vigente; alarmes, sensores, switch/rack,
    fontes e incêndio pelo último preço pago em nota. Itens "estimado": câmeras pela ocupação média dos gravadores (${nf(P.ocupacao_media, 1)}%) onde a planilha não informou e
    1 HD por gravador antigo. Cabos e conectores não entram. Data-base ${String(P.data_base).split('-').reverse().join('/')}.`;
  const k = (l2, v, n, c, a) => `<div class="card kpi ${c || ''}" ${a ? `onclick="${a}" style="cursor:pointer"` : ''}><div class="l">${l2}</div><div class="v">${v}</div><div class="n">${n || ''}</div></div>`;
  $('kpis').innerHTML = [
    k('Patrimônio total (preço de hoje)', brl(tot), `${nf(soma(l, x => x.qtd))} itens`),
    k('Anterior a 2026', brl(porBase('anterior_2026') + porBase('estimativa')), 'planilha por loja + estimativas', 'neu', "setBase('anterior_2026')"),
    k('Compras de 2026', brl(porBase('compras_2026')), 'consideradas instaladas', '', "setBase('compras_2026')"),
    k('Valor estimado', brl(est), tot ? nf(est / tot * 100, 1) + '% do total — confirmar nas lojas' : '', 'warn', "setBase('estimativa')"),
    k('Câmeras', nf(cam), brl(soma(l.filter(x => x.categoria === 'camera'), x => x.valor)), '', "setCat('camera')"),
    k('Gravadores', nf(grav), brl(soma(l.filter(x => x.categoria === 'dvr_nvr'), x => x.valor)), '', "setCat('dvr_nvr')"),
    ...($('fLoja').value === '' && P.sem_loja ? [k('Em notas sem loja definida', brl(P.sem_loja), 'confirme a loja na Conferência do CFTV', 'bad', "setLoja('null')")] : [])
  ].join('');
  // por loja (todas as lojas ativas, mesmo sem patrimônio)
  const g = new Map(); for (const x of l) { const o = g.get(x.loja) || {loja: x.loja, v: 0, ant: 0, nov: 0, cam: 0, grav: 0}; o.v += Number(x.valor);
    if (x.base === 'compras_2026') o.nov += Number(x.valor); else o.ant += Number(x.valor); if (x.categoria === 'camera') o.cam += Number(x.qtd); if (x.categoria === 'dvr_nvr') o.grav += Number(x.qtd); g.set(x.loja, o); }
  if ($('fLoja').value === '' && !$('fCat').value && !$('fBase').value && !$('fBusca').value) for (const c of ATIVAS.keys()) if (!g.has(c)) g.set(c, {loja: c, v: 0, ant: 0, nov: 0, cam: 0, grav: 0});
  const pl = [...g.values()].sort((a, b) => b.v - a.v), mx = Math.max(1, ...pl.map(x => x.v));
  $('tLojas').innerHTML = tabela([{t: 'Loja', f: x => esc(nLoja(x.loja))}, {t: 'Câmeras', n: 1, f: x => nf(x.cam)}, {t: 'Grav.', n: 1, f: x => nf(x.grav)},
    {t: 'Anterior 2026', n: 1, f: x => brl(x.ant)}, {t: 'Compras 2026', n: 1, f: x => brl(x.nov)},
    {t: 'Total', n: 1, f: x => `<span class="barra" style="width:${(x.v / mx * 60).toFixed(0)}px"></span><b>${brl(x.v)}</b>`}], pl,
    x => `setLoja('${x.loja === null ? 'null' : x.loja}')`, ['Total', nf(soma(pl, x => x.cam)), nf(soma(pl, x => x.grav)), brl(soma(pl, x => x.ant)), brl(soma(pl, x => x.nov)), brl(soma(pl, x => x.v))]);
  const gc = Object.values(l.reduce((a, x) => { a[x.categoria] = a[x.categoria] || {c: x.categoria, q: 0, v: 0}; a[x.categoria].q += Number(x.qtd); a[x.categoria].v += Number(x.valor); return a; }, {})).sort((a, b) => b.v - a.v);
  $('tCats').innerHTML = tabela([{t: 'Equipamento', f: x => esc(CAT[x.c] || x.c)}, {t: 'Qtd', n: 1, f: x => nf(x.q)}, {t: 'Valor', n: 1, f: x => brl(x.v)}, {t: '%', n: 1, f: x => tot ? nf(x.v / tot * 100, 1) + '%' : '—'}], gc,
    x => `setCat('${x.c}')`, ['Total', nf(soma(gc, x => x.q)), brl(tot), '100%']);
  const pr = (P.precos || []).filter((x, i, a) => a.findIndex(y => y.categoria === x.categoria && y.preco === x.preco) === i);
  $('tPrecos').innerHTML = tabela([{t: 'Equipamento', f: x => esc(CAT[x.categoria])}, {t: 'Preço', n: 1, f: x => brl(x.preco)}, {t: 'Fonte', f: x => `<span class="sub">${esc(x.fonte)}</span>`}], pr);
  $('tItens').innerHTML = tabela([{t: 'Loja', f: x => esc(nLoja(x.loja))}, {t: 'Equipamento', f: x => esc(CAT[x.categoria] || x.categoria)},
    {t: 'Item', f: x => esc(x.item) + (x.estimado ? ' <span class="chip warn">estimado</span>' : '')}, {t: 'Origem', f: x => `<span class="chip ${x.base === 'compras_2026' ? '' : 'neu'}">${BASE[x.base]}</span>`},
    {t: 'Qtd', n: 1, f: x => nf(x.qtd)}, {t: 'Preço de hoje', n: 1, f: x => brl(x.preco)}, {t: 'Valor', n: 1, f: x => brl(x.valor)}, {t: 'Fonte do preço', f: x => `<span class="sub">${esc(x.fonte)}</span>`}], l,
    null, ['Total', '', '', '', nf(soma(l, x => x.qtd)), '', brl(tot), '']);
  $('rodape').textContent = `Fonte: inventário do módulo Segurança e CFTV (planilha por loja + notas de 2026) — ${P.linhas.length} linhas. Emitido em ${new Date().toLocaleString('pt-BR')}.`;
}
function setLoja(v) { $('fLoja').value = v; render(); window.scrollTo({top: $('tItens').offsetTop - 80, behavior: 'smooth'}); }
function setCat(v) { $('fCat').value = v; render(); }
function setBase(v) { $('fBase').value = v; render(); }
function limpar() { ['fLoja', 'fCat', 'fBase', 'fBusca'].forEach(i => $(i).value = ''); render(); }
function excel() {
  const l = filtradas(), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(l.map(x => ({Loja: nLoja(x.loja), Equipamento: CAT[x.categoria] || x.categoria, Item: x.item, Origem: BASE[x.base],
    Estimado: x.estimado ? 'sim' : 'não', Quantidade: Number(x.qtd), PrecoHoje: Number(x.preco), Valor: Number(x.valor), FontePreco: x.fonte}))), 'Itens');
  const g = {}; for (const x of l) { g[x.loja] = g[x.loja] || {Loja: nLoja(x.loja), Valor: 0}; g[x.loja].Valor += Number(x.valor); }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(g).sort((a, b) => b.Valor - a.Valor)), 'Por loja');
  XLSX.writeFile(wb, 'patrimonio-seguranca.xlsx');
  sb.rpc('cftv_registrar', {p_acao: 'exportacao', p_tabela: 'excel', p_registro: 'patrimonio-seguranca'}).then(() => {});
}
iniciar();
</script>
</body>
</html>
