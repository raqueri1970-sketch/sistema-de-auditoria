<div class="gg-ov" id="ggOv">
  <div class="gg-bar">
    <label for="ggPer">Período</label>
    <select id="ggPer" onchange="ggSetPer(this.value)">
      <option value="painel">Período do painel</option>
      <option value="mes">Mês atual</option>
      <option value="3m">Últimos 3 meses</option>
      <option value="6m">Últimos 6 meses</option>
      <option value="ano">Ano atual</option>
      <option value="tudo">Tudo</option>
      <option value="livre">Escolher datas</option>
    </select>
    <input type="date" id="ggDe" onchange="ggLivre()" aria-label="De">
    <input type="date" id="ggAte" onchange="ggLivre()" aria-label="Até">
    <label for="ggLoja">Loja</label>
    <select id="ggLoja" onchange="ggRender()"><option value="">Todas</option></select>
    <label for="ggOrig">Origem</label>
    <select id="ggOrig" onchange="ggRender()"><option value="">Compras + Obras</option><option value="C">Só compras</option><option value="O">Só obras</option></select>
    <span class="sp"></span>
    <button class="gbtn" onclick="ggCarregar(true)" title="Busca de novo as despesas de Obras & Reformas">⟳ Atualizar obras</button>
    <button class="gbtn r" onclick="ggBaixarPDF()">📄 Baixar PDF</button>
    <button class="gbtn b" onclick="ggImprimir()">🖨️ Imprimir</button>
    <button class="gbtn g" onclick="ggExcel()">⬇ Excel</button>
    <button class="gbtn" onclick="ggFechar()">✕ Fechar</button>
  </div>
  <div class="gg-doc" id="ggDoc"></div>
  <div class="gg-busy" id="ggBusy"><div class="sp3"></div>Gerando o PDF…<small>pode levar alguns segundos</small></div>
</div>
